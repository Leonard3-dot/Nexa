name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        run: |
          mkdir www
          cp index.html *.js *.css *.png *.webmanifest www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "NEXA Music" com.leonard.nexamusic --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp icon-192.png {} \;
          npx cap sync android

      - name: Ajouter la couche native (lecture en arrière-plan, notification, autorisations)
        run: |
          for f in MainActivity.java NexaMediaPlugin.java MediaPlaybackService.java patch-manifest.py native.js; do
            test -f "./$f" || { echo "ERREUR : le fichier $f est absent de la racine du dépôt (ajoutez-le puis relancez)"; exit 1; }
          done
          JAVA_DIR=android/app/src/main/java/com/leonard/nexamusic
          mkdir -p "$JAVA_DIR"
          cp ./MainActivity.java ./NexaMediaPlugin.java ./MediaPlaybackService.java "$JAVA_DIR"/
          python3 ./patch-manifest.py android/app/src/main/AndroidManifest.xml
          grep -n "permission\|service" android/app/src/main/AndroidManifest.xml

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEXA-Music.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest NEXA-Music.apk --title "NEXA Music (APK)" --notes "Dernière version de l'application Android NEXA Music. Touchez NEXA-Music.apk pour la télécharger."
