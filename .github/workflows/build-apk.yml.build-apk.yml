name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        run: |
          mkdir www
          cp index.html *.js *.css *.png *.webmanifest www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "NEXA Music" com.leonard.nexamusic --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp icon-192.png {} \;
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
