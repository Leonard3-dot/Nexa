<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXA Music</title>
<meta name="description" content="NEXA Music — votre musique, sans connexion.">
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXA">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icônes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14.5 5.5l5 14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5v14l10-7zM17 5h2v14h-2z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5v14L8 12zM5 5h2v14H5z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1.5v4.5"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h13M3 12h10M3 18h7"/><path d="m16 14 5 3.5-5 3.5z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h1M7 8v8M11 4v16M15 7v10M19 10v4M22 12h-1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-6.5 0-3-2-5-3.5-7-.5-1-1-3-1.500-5.500-3 2-6 5.500-6 9.500 0 .8.2 1.500.5 2-1-.3-1.800-1.200-2-2.500C5.500 13 5 14.500 5 15.500 5 19.300 8 22 12 22z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 4 20 4c0 10-5 16-13 16"/><path d="M5 19c2-5 5-8 9-10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.200"/><circle cx="9" cy="12" r="2.200"/><circle cx="17" cy="18" r="2.200"/></symbol>
  <symbol id="i-play-o" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
</svg>

<div class="aurora" aria-hidden="true"></div>
<div id="app">

  <!-- Barre latérale (ordinateur) -->
  <aside id="side">
    <a class="brand" href="#/home"><img src="logo.png" alt="" width="42" height="42"><span class="wm"><b>NEXA</b><small>MUSIC</small></span></a>
    <nav class="side-nav">
      <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Accueil</span></a>
      <a href="#/explore" data-nav="explore"><svg class="ic"><use href="#i-compass"/></svg><span>Explorer</span></a>
      <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Rechercher</span></a>
      <a href="#/profile" data-nav="profile"><svg class="ic"><use href="#i-user"/></svg><span>Profil</span></a>
    </nav>
    <div class="side-lib">
      <div class="side-lib-head">
        <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Bibliothèque</span></a>
        <button class="icon-btn" data-act="new-playlist" title="Nouvelle playlist"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div id="side-list"></div>
    </div>
    <div class="side-foot">
      <button class="btn ghost" data-act="import"><svg class="ic"><use href="#i-upload"/></svg>Ajouter de la musique</button>
      <button class="btn ghost" data-act="import-folder"><svg class="ic"><use href="#i-folder"/></svg>Scanner un dossier</button>
      <button class="btn ghost install" data-act="install" hidden><svg class="ic"><use href="#i-download"/></svg>Installer l'application</button>
    </div>
  </aside>

  <main id="main"><div id="view"></div></main>

  <!-- Lecteur (barre en bas sur ordinateur, mini-lecteur sur mobile) -->
  <footer id="player" class="empty">
    <div class="pl-info" data-act="open-np">
      <div class="cover sm" id="pl-cover"></div>
      <div class="pl-text"><div class="t" id="pl-title">—</div><div class="a" id="pl-artist">—</div></div>
      <button class="icon-btn like-btn hide-m" data-act="like-current" aria-label="J'aime"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="pl-center">
      <div class="ctrls">
        <button class="icon-btn hide-m" data-act="shuffle" aria-label="Aléatoire"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn hide-m" data-act="prev" aria-label="Précédent"><svg class="ic f"><use href="#i-prev"/></svg></button>
        <button class="play-btn" data-act="toggle" aria-label="Lecture / pause"><svg class="ic f"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-act="next" aria-label="Suivant"><svg class="ic f"><use href="#i-next"/></svg></button>
        <button class="icon-btn hide-m" data-act="repeat" aria-label="Répéter"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek-row hide-m">
        <span class="time cur">0:00</span>
        <input class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
        <span class="time dur">0:00</span>
      </div>
    </div>
    <div class="pl-right hide-m">
      <button class="icon-btn" data-act="queue" aria-label="File d'attente"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" data-act="mute" aria-label="Volume"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <div class="mini-progress"><i></i></div>
  </footer>

  <!-- Navigation basse (mobile) -->
  <nav id="tabs">
    <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Accueil</span></a>
    <a href="#/explore" data-nav="explore"><svg class="ic"><use href="#i-compass"/></svg><span>Explorer</span></a>
    <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Bibliothèque</span></a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Recherche</span></a>
    <a href="#/profile" data-nav="profile"><svg class="ic"><use href="#i-user"/></svg><span>Profil</span></a>
  </nav>
</div>

<!-- Lecteur plein écran -->
<section id="np" aria-label="Lecture en cours">
  <div class="np-bg" aria-hidden="true"><img id="np-bg" alt=""></div>
  <header class="np-head">
    <button class="icon-btn" data-act="close-np" aria-label="Réduire"><svg class="ic"><use href="#i-down"/></svg></button>
    <div class="np-label">Lecture en cours</div>
    <button class="icon-btn" data-act="np-more" aria-label="Plus"><svg class="ic"><use href="#i-more"/></svg></button>
  </header>
  <div class="np-body">
    <div class="np-art"><div class="np-wave l" aria-hidden="true"></div><div class="cover xl" id="np-cover"></div><div class="np-wave r" aria-hidden="true"></div></div>
    <div class="np-side">
      <div class="np-titles">
        <div class="np-tt"><div class="t" id="np-title">—</div><div class="a" id="np-artist">—</div></div>
        <button class="icon-btn big like-btn" data-act="like-current" aria-label="J'aime"><svg class="ic"><use href="#i-heart"/></svg></button>
      </div>
      <div class="np-seek">
        <input class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
        <div class="np-times"><span class="time cur">0:00</span><span class="time dur">0:00</span></div>
      </div>
      <div class="np-ctrls">
        <button class="icon-btn" data-act="shuffle" aria-label="Aléatoire"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn big" data-act="prev" aria-label="Précédent"><svg class="ic f"><use href="#i-prev"/></svg></button>
        <button class="play-btn xl" data-act="toggle" aria-label="Lecture / pause"><svg class="ic f"><use href="#i-play"/></svg></button>
        <button class="icon-btn big" data-act="next" aria-label="Suivant"><svg class="ic f"><use href="#i-next"/></svg></button>
        <button class="icon-btn" data-act="repeat" aria-label="Répéter"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="np-foot">
        <button class="chip" data-act="queue"><svg class="ic"><use href="#i-queue"/></svg>File d'attente</button>
        <button class="chip" data-act="eq"><svg class="ic"><use href="#i-sliders"/></svg>Égaliseur</button>
        <button class="chip" data-act="similar"><svg class="ic"><use href="#i-sparkle"/></svg>Similaires</button>
      </div>
      <button class="np-next" id="np-next" data-act="next" hidden><span class="lbl">À suivre</span><span class="nt" id="np-next-t"></span></button>
    </div>
  </div>
  <div id="queue-panel">
    <div class="q-head"><b>File d'attente</b><button class="icon-btn" data-act="queue" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="queue-list"></div>
  </div>
</section>

<!-- Feuilles / menus -->
<div id="sheet-wrap" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" hidden><span class="msg"></span><div class="bar"><i></i></div></div>

<input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.weba" multiple hidden>
<input id="folder-input" type="file" webkitdirectory multiple hidden>

<audio id="audio" preload="auto"></audio>
<script src="meta.js"></script>
<script src="intel.js"></script>
<script src="eq.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
